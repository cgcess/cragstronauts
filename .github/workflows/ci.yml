name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The job authenticates to ZeroVault as itself: no API key is stored here.
    # ZeroVault trusts this repository for pushes to main only.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pull build-time web vars from ZeroVault. Only pushes to main can: a
      # pull request runs code that has not been reviewed yet, and this
      # repository is public, so it is not trusted for that event. The build
      # tolerates missing vars, so pull request checks still pass.
      - name: Fetch secrets
        if: ${{ github.event_name == 'push' }}
        run: bin/fetch-secrets

      - run: pnpm turbo typecheck build

      - run: npx vitest run
