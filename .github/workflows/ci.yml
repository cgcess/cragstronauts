name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # No ZeroVault credential. The two build-time values below are public (a
    # Clerk publishable key and a VAPID public key) and only decide what the
    # bundle embeds, which this job never deploys. Real values reach the bundle
    # through `pnpm run deploy`, which reads them from ZeroVault.
    env:
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci
      VITE_VAPID_PUBLIC_KEY: ci-vapid-public-key
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo typecheck build

      - run: npx vitest run
